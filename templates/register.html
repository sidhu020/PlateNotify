{% extends "base.html" %}

{% block title %}Register – PlateNotify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="bi bi-person-plus"></i> Create Account
                </h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register') }}" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope"></i> Email Address
                        </label>
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="you@example.com" required>
                        <small class="form-text text-muted">We'll never share your email.</small>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="At least 6 characters" minlength="6" required>
                        <small class="form-text text-muted">Must be at least 6 characters.</small>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">
                            <i class="bi bi-lock-check"></i> Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirm_password" 
                               name="confirm_password" placeholder="Re-enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Create Account
                    </button>
                </form>
            </div>
            <div class="card-footer text-center">
                <small class="text-muted">
                    Already have an account? 
                    <a href="{{ url_for('login') }}">Log in here</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
