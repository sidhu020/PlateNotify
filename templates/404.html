{% extends "base.html" %}

{% block title %}Page Not Found – PlateNotify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="mb-4" style="font-size: 5rem; color: #ccc;">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h1 class="display-4 mb-3">404</h1>
        <h2 class="mb-4 text-muted">Page Not Found</h2>
        <p class="lead mb-4">
            Oops! The page you're looking for doesn't exist.
        </p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-4">
                <i class="bi bi-house"></i> Go Home
            </a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary btn-lg px-4">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
