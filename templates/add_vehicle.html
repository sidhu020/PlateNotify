{% extends "base.html" %}

{% block title %}Add Vehicle – PlateNotify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">
                    <i class="bi bi-car-front"></i> Register a Vehicle
                </h4>
            </div>
            <div class="card-body">
                <p class="text-muted mb-4">
                    Enter your license plate to start receiving notifications about anonymous reports.
                </p>
                <form method="POST" action="{{ url_for('add_vehicle') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="plate_number" class="form-label">
                            <i class="bi bi-tag"></i> License Plate Number
                        </label>
                        <input type="text" class="form-control" id="plate_number" name="plate_number" 
                               placeholder="e.g., ABC1234" maxlength="10" required>
                        <small class="form-text text-muted">2-10 characters. Format can be any format used in your region.</small>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> Add Vehicle
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
